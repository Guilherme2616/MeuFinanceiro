<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formas de Pagamento - Meu Financeiro</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #FDFDE5; font-family: 'Raleway', sans-serif; color: #333; }
        .btn-salvar { background-color: #783E19; color: white; font-weight: 700; border: none; }
        .btn-salvar:hover { background-color: #5c2e11; color: white; }
        .icon-selector input[type="radio"] { display: none; }
        .icon-selector label {
            display: inline-block; padding: 10px 15px; margin: 5px; 
            font-size: 1.5rem; border: 2px solid transparent; 
            border-radius: 12px; cursor: pointer; transition: 0.2s;
            background-color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
        }
        .icon-selector input[type="radio"]:checked + label { border-color: #5F7254; background-color: #e9f0e6; color: #5F7254; transform: scale(1.1); }
        .card-custom { border-radius: 16px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header-bg { background-color: #5F7254; color: white; border-radius: 16px 16px 0 0; padding: 15px; }
    </style>
</head>
<body class="p-4 p-md-5">

<div class="container" style="max-width: 900px;">
    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-dark rounded-pill fw-bold mb-4"><i class="bi bi-arrow-left me-2"></i>Voltar</a>
    
    <div class="row g-4 justify-content-center">
        <div class="col-md-10">
            <div class="card card-custom h-100 bg-white">
                <div class="header-bg fw-bold fs-5"><i class="bi bi-credit-card-fill me-2"></i>Nova Forma de Pagamento</div>
                <div class="card-body p-4">
                    <form method="POST" autocomplete="off">
                        <div class="row mb-3">
                            <div class="col-9"><label class="form-label fw-bold">Nome da Forma</label><input type="text" name="nome" class="form-control" placeholder="Ex: Cartão Nubank, VR..." required></div>
                            <div class="col-3"><label class="form-label fw-bold">Cor Fundo</label><input type="color" name="cor" class="form-control form-control-color w-100" value="#20c997" title="Escolha a cor"></div>
                        </div>

                        <label class="form-label fw-bold mt-2">Escolha um Ícone</label>
                        <div class="icon-selector mb-4">
                            <input type="radio" id="ic1" name="icone" value="bi-credit-card" checked><label for="ic1"><i class="bi bi-credit-card"></i></label>
                            <input type="radio" id="ic2" name="icone" value="bi-cash-stack"><label for="ic2"><i class="bi bi-cash-stack"></i></label>
                            <input type="radio" id="ic3" name="icone" value="bi-phone"><label for="ic3"><i class="bi bi-phone"></i></label>
                            <input type="radio" id="ic4" name="icone" value="bi-bank"><label for="ic4"><i class="bi bi-bank"></i></label>
                            <input type="radio" id="ic5" name="icone" value="bi-wallet2"><label for="ic5"><i class="bi bi-wallet2"></i></label>
                            <input type="radio" id="ic6" name="icone" value="bi-coin"><label for="ic6"><i class="bi bi-coin"></i></label>
                            <input type="radio" id="ic7" name="icone" value="bi-qr-code-scan"><label for="ic7"><i class="bi bi-qr-code-scan"></i></label>
                            <input type="radio" id="ic8" name="icone" value="bi-currency-dollar"><label for="ic8"><i class="bi bi-currency-dollar"></i></label>
                        </div>
                        <button type="submit" class="btn btn-salvar w-100 py-2 rounded-pill">Salvar Pagamento</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <h4 class="mt-5 mb-4 fw-bold text-center" style="color: #5F7254;">Formas Cadastradas</h4>
    <div class="row g-3 justify-content-center">
        {% for f in formas %}
        <div class="col-md-4">
            <div class="card card-custom bg-white p-3 border-top border-5" style="border-color: {{ f.cor }} !important;">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="fw-bold m-0 text-dark d-flex align-items-center"><i class="bi {{ f.icone }} me-2" style="color: {{ f.cor }};"></i>{{ f.nome }}</h5>
                    </div>
                    <a href="{{ url_for('excluir_forma', id=f.id) }}" class="text-danger" onclick="return confirm('Excluir esta forma de pagamento?')"><i class="bi bi-trash-fill"></i></a>
                </div>
            </div>
        </div>
        {% else %}
        <div class="col-12 text-center text-muted mt-3"><p>Nenhuma forma de pagamento foi encontrada.</p></div>
        {% endfor %}
    </div>
</div>

</body>
</html>
