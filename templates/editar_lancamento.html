<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Lançamento</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #FDFDE5; font-family: 'Raleway', sans-serif; }
        .card-custom { border-radius: 16px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="p-5">

<div class="container" style="max-width: 800px;">
    <a href="{{ url_for('lancamentos') }}" class="btn btn-outline-dark rounded-pill fw-bold mb-4">Cancelar Edição</a>
    
    <div class="card card-custom bg-white p-5">
        <h4 class="fw-bold mb-4" style="color: #5F7254;">Editando: {{ mov.descricao }}</h4>
        
        <form class="row g-3" method="POST" autocomplete="off">
            <div class="col-md-4">
                <label class="form-label fw-bold">Operação</label>
                <select name="tipo_movimentacao" class="form-select">
                    <option value="Saída" {% if mov.tipo_movimentacao == 'Saída' %}selected{% endif %}>🔴 Saída</option>
                    <option value="Entrada" {% if mov.tipo_movimentacao == 'Entrada' %}selected{% endif %}>🟢 Entrada</option>
                    <option value="Investimento" {% if mov.tipo_movimentacao == 'Investimento' %}selected{% endif %}>🔵 Investimento</option>
                </select>
            </div>
            <div class="col-md-8">
                <label class="form-label fw-bold">Descrição</label>
                <input type="text" name="descricao" class="form-control" value="{{ mov.descricao }}" required>
            </div>
            
            <div class="col-md-4">
                <label class="form-label fw-bold">Valor (R$)</label>
                <input type="text" name="valor" class="form-control" value="{{ mov.valor|formato_moeda }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold">Data</label>
                <input type="date" name="data" class="form-control" value="{{ mov.data.strftime('%Y-%m-%d') }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold">Pagamento</label>
                <select name="forma_pagto" class="form-select">
                    {% for f in formas %}
                    <option value="{{ f.nome }}" {% if mov.forma_pagto == f.nome %}selected{% endif %}>{{ f.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-bold">Categoria</label>
                <select name="categoria" class="form-select">
                    {% for c in categorias %}
                    <option value="{{ c.nome }}" {% if mov.categoria == c.nome %}selected{% endif %}>{{ c.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Subcategoria</label>
                <select name="subcategoria" class="form-select">
                    <option value="">Nenhuma</option>
                    {% for sub in subcategorias %}
                    <option value="{{ sub.nome }}" {% if mov.subcategoria == sub.nome %}selected{% endif %}>{{ sub.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="col-12 mt-4">
                <button type="submit" class="btn w-100 fw-bold py-2" style="background-color: #5F7254; color: white;">Salvar Alterações</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
