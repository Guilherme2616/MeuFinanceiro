<div class="mf-sidebar">

    <div class="mf-sidebar-header">

        <div class="mf-logo">
            <i data-lucide="wallet"></i>
        </div>

        <div class="mf-logo-text">
            <h4>Meu Financeiro</h4>
            <small>Seu patrimônio organizado</small>
        </div>

    </div>

    <hr class="mf-divider">

    <nav class="mf-sidebar-menu">

        <div class="mf-nav-group">

            <p>GERAL</p>

            <a href="{{ url_for('dashboard') }}"
               class="mf-nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
                <div class="mf-nav-icon">
                    <i data-lucide="layout-dashboard"></i>
                </div>
                <span>Dashboard</span>
            </a>

        </div>

        <div class="mf-nav-group">

            <p>FINANCEIRO</p>

            <a href="{{ url_for('lancamentos') }}"
               class="mf-nav-item {% if request.endpoint == 'lancamentos' %}active{% endif %}">
                <div class="mf-nav-icon">
                    <i data-lucide="receipt"></i>
                </div>
                <span>Lançamentos</span>
            </a>

            <a href="{{ url_for('cartoes') }}"
               class="mf-nav-item {% if request.endpoint == 'cartoes' %}active{% endif %}">
                <div class="mf-nav-icon">
                    <i data-lucide="credit-card"></i>
                </div>
                <span>Cartões</span>
            </a>

            <a href="{{ url_for('orcamentos') }}"
               class="mf-nav-item {% if request.endpoint == 'orcamentos' %}active{% endif %}">
                <div class="mf-nav-icon">
                    <i data-lucide="target"></i>
                </div>
                <span>Orçamentos</span>
            </a>

        </div>

        <div class="mf-nav-group">

            <p>PATRIMÔNIO</p>

            <a href="{{ url_for('investimentos') }}"
               class="mf-nav-item {% if request.endpoint == 'investimentos' %}active{% endif %}">
                <div class="mf-nav-icon">
                    <i data-lucide="trending-up"></i>
                </div>
                <span>Investimentos</span>
            </a>

        </div>

        <div class="mf-nav-group">

            <p>CONFIGURAÇÕES</p>

            <a href="{{ url_for('gerenciar_categorias') }}"
               class="mf-nav-item {% if request.endpoint == 'gerenciar_categorias' %}active{% endif %}">
                <div class="mf-nav-icon">
                    <i data-lucide="tags"></i>
                </div>
                <span>Categorias</span>
            </a>

            <a href="{{ url_for('gerenciar_formas') }}"
               class="mf-nav-item {% if request.endpoint == 'gerenciar_formas' %}active{% endif %}">
                <div class="mf-nav-icon">
                    <i data-lucide="wallet-cards"></i>
                </div>
                <span>Formas de Pagamento</span>
            </a>

        </div>

    </nav>

    <div class="mf-sidebar-footer">

        <div class="mf-user">

            <div class="mf-avatar">
                {{ current_user.nome_completo[0]|upper }}
            </div>

            <div class="mf-user-info">

                <strong>{{ current_user.nome_completo.split(' ')[0] }}</strong>

                <small>Usuário</small>

                <a href="{{ url_for('logout') }}">
                    <i data-lucide="log-out"></i>
                    Encerrar sessão
                </a>

            </div>

        </div>

    </div>

</div>
