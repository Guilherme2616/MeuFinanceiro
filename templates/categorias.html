<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Categorias - Meu Financeiro</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #FDFDE5; font-family: 'Raleway', sans-serif; color: #333; }
        .btn-salvar { background-color: #783E19; color: white; font-weight: 700; border: none; }
        .btn-salvar:hover { background-color: #5c2e11; color: white; }
        
        /* Estilo do Seletor de Ícones (Radio Buttons invisíveis) */
        .icon-selector input[type="radio"] { display: none; }
        .icon-selector label {
            display: inline-block; padding: 10px 15px; margin: 5px; 
            font-size: 1.5rem; border: 2px solid transparent; 
            border-radius: 12px; cursor: pointer; transition: 0.2s;
            background-color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .icon-selector input[type="radio"]:checked + label {
            border-color: #5F7254; background-color: #e9f0e6; color: #5F7254;
            transform: scale(1.1);
        }
        .card-custom { border-radius: 16px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header-bg { background-color: #5F7254; color: white; border-radius: 16px 16px 0 0; padding: 15px; }
    </style>
</head>
<body class="p-4 p-md-5">

<div class="container" style="max-width: 900px;">
    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-dark rounded-pill fw-bold mb-4"><i class="bi bi-arrow-left me-2"></i>Voltar ao Dashboard</a>
    
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card card-custom h-100 bg-white">
                <div class="header-bg fw-bold"><i class="bi bi-tag-fill me-2"></i>Nova Categoria</div>
                <div class="card-body p-4">
                    <form method="POST">
                        <input type="hidden" name="tipo_form" value="categoria">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nome da Categoria</label>
                            <input type="text" name="nome" class="form-control" placeholder="Ex: Festas, Veículo..." required>
                        </div>
                        <label class="form-label fw-bold mt-2">Escolha um Ícone</label>
                        <div class="icon-selector mb-4">
                            <input type="radio" id="ic1" name="icone" value="bi-house-door" checked><label for="ic1"><i class="bi bi-house-door"></i></label>
                            <input type="radio" id="ic2" name="icone" value="bi-cart"><label for="ic2"><i class="bi bi-cart"></i></label>
                            <input type="radio" id="ic3" name="icone" value="bi-car-front"><label for="ic3"><i class="bi bi-car-front"></i></label>
                            <input type="radio" id="ic4" name="icone" value="bi-balloon"><label for="ic4"><i class="bi bi-balloon"></i></label>
                            <input type="radio" id="ic5" name="icone" value="bi-heart-pulse"><label for="ic5"><i class="bi bi-heart-pulse"></i></label>
                            <input type="radio" id="ic6" name="icone" value="bi-controller"><label for="ic6"><i class="bi bi-controller"></i></label>
                            <input type="radio" id="ic7" name="icone" value="bi-mortarboard"><label for="ic7"><i class="bi bi-mortarboard"></i></label>
                            <input type="radio" id="ic8" name="icone" value="bi-airplane"><label for="ic8"><i class="bi bi-airplane"></i></label>
                            <input type="radio" id="ic9" name="icone" value="bi-lightning-charge"><label for="ic9"><i class="bi bi-lightning-charge"></i></label>
                            <input type="radio" id="ic10" name="icone" value="bi-piggy-bank"><label for="ic10"><i class="bi bi-piggy-bank"></i></label>
                        </div>
                        <button type="submit" class="btn btn-salvar w-100 py-2 rounded-pill">Salvar Categoria</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card card-custom h-100 bg-white">
                <div class="header-bg fw-bold" style="background-color: #4a5c41;"><i class="bi bi-diagram-2-fill me-2"></i>Nova Subcategoria</div>
                <div class="card-body p-4">
                    <form method="POST">
                        <input type="hidden" name="tipo_form" value="subcategoria">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Pertence à qual Categoria?</label>
                            <select name="categoria_id" class="form-select" required>
                                {% for cat in categorias %}
                                <option value="{{ cat.id }}">{{ cat.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Nome da Subcategoria</label>
                            <input type="text" name="nome" class="form-control" placeholder="Ex: Combustível, Decoração..." required>
                        </div>
                        <button type="submit" class="btn btn-salvar w-100 py-2 rounded-pill">Salvar Subcategoria</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <h4 class="mt-5 mb-4 fw-bold" style="color: #5F7254;">Suas Categorias</h4>
    <div class="row g-3">
        {% for cat in categorias %}
        <div class="col-md-4">
            <div class="card card-custom bg-white p-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="fw-bold m-0"><i class="bi {{ cat.icone }} me-2" style="color: #5F7254;"></i>{{ cat.nome }}</h5>
                    <a href="{{ url_for('excluir_categoria', id=cat.id) }}" class="text-danger" onclick="return confirm('Excluir esta categoria apagará todas as subcategorias dela. Confirmar?')"><i class="bi bi-trash-fill"></i></a>
                </div>
                <ul class="list-unstyled ms-4 mt-2 mb-0 small text-muted fw-bold">
                    {% for sub in cat.subcategorias %}
                    <li><i class="bi bi-arrow-return-right me-1"></i> {{ sub.nome }}</li>
                    {% else %}
                    <li><i class="opacity-50">Nenhuma subcategoria</i></li>
                    {% endfor %}
                </ul>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
